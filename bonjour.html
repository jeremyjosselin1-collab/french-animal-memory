<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jeux des animaux</title>
<link rel="icon" href="data:,">
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#fff3e0;color:#333;text-align:center;min-height:100vh;overflow-x:hidden}
.menu{display:inline-block;margin:10px 4px;padding:10px 16px;background:#6c5ce7;color:#fff;border-radius:12px;text-decoration:none;font-size:1.1rem}
h1{font-size:1.6rem;margin:6px 0}
button{font-size:1.25rem;padding:14px 20px;border:0;border-radius:14px;margin:6px;background:#00b894;color:#fff;cursor:pointer}
button.say{background:#0984e3}button.tap{background:#fdcb6e;color:#333}button.on{background:#d63031}
.big{font-size:7rem;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:12px auto;padding:0 12px}
.opt{background:#fff;color:#333;font-size:1.5rem;padding:16px 6px;box-shadow:0 3px 8px #0002;margin:0}
.opt.e{font-size:4rem;padding:8px}
.ok{background:#55efc4!important}.no{background:#fab1a0!important}
#msg{min-height:1.6em;font-size:1.2rem;padding:0 12px}
#score{font-size:1.2rem;font-weight:bold}
#kid{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:1.3rem;font-weight:bold;margin:6px}
#end{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;font-size:1.6rem;background:#fff7e6;z-index:9}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.25)}}
#prompt{font-size:2rem;font-weight:bold;color:#6c5ce7;margin:6px}#heard{min-height:1.4em;color:#636e72}
</style></head><body>
<a class="menu" href="./" data-t="menu">🏠 Menu</a>
<div id="kid"></div>
<h1 data-t="gBonjour" data-i="0"></h1>

<div id="score"></div><div class="big" id="emo"></div><div id="prompt"></div>
<button class="say" id="hear" data-t="hearBtn"></button><button id="mic" data-t="talk"></button><br>
<div id="heard"></div><div id="msg"></div><div id="end"><div style="font-size:5rem">🏆</div><div id="endtxt"></div><button id="again" data-t="again"></button><a class="menu" href="./" data-t="menu"></a></div>
<script>
header();document.title=document.querySelector("h1").textContent;
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pop(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function endScreen(txt){$("endtxt").textContent=txt;$("end").style.display="flex";speak(t("bravo"))}
</script>
<script>
const R=8;let list,round,score,a,step,rec=null,busy=false,grace=null,live=false;
const pad=s=>" "+norm(s)+" ";
function start(){list=shuffle(ANIMALS);round=0;score=0;$("end").style.display="none";next()}
function next(){
  if(round>=R){stopRec();return endScreen(t("b_end",score,R,localStorage.getItem("fr_current")||""))}
  a=list[round++];step=1;busy=false;clearTimeout(grace);$("emo").textContent=a.e;pop($("emo"));$("score").textContent=t("b_animal",round,R,score);
  $("prompt").textContent=t("b_prompt");$("heard").textContent="";
  $("msg").textContent=SR?t("b_instr"):t("b_nomic");
  setTimeout(()=>speak(t("b_say")),300);
}
function done(){if(busy)return;busy=true;step=3;clearTimeout(grace);score++;$("score").textContent=t("b_animal",round,R,score);$("msg").textContent=t("b_super");pauseRec();speak(t("b_superSay"));setTimeout(()=>{next();if(live)resumeRec()},1700)}
function words(x){return norm(x).split(" ").filter(Boolean).length}
// Name found in a transcript? Returns the words after it (the sound), or null.
function after(x){const n=pad(x);for(const w of names(a)){const i=n.indexOf(" "+w+" ");if(i>=0)return n.slice(i+w.length+2)}return null}
function onSpeech(all,alts){
  if(busy)return;
  let rest=null;for(const x of [all,...alts]){const r=after(x);if(r!=null&&(rest==null||words(r)>words(rest)))rest=r}
  if(rest==null){if(words(all)>0)$("msg").textContent=t("b_addName",art(a)+a.w);return}
  if(words(rest)>0)return done();
  // Name heard; wait for the sound, or finish on silence.
  step=2;$("prompt").textContent=t("b_sound",a);$("msg").textContent=t("b_eg",a.s);
  clearTimeout(grace);grace=setTimeout(()=>{if(step==2&&!busy)done()},3000);
}
function startRec(){
  rec=new SR();rec.lang=SRLANG;rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onresult=e=>{
    if(busy)return;
    const all=[...e.results].map(r=>r[0].transcript).join(" ");$("heard").textContent=t("heard",all.trim());
    onSpeech(all,[...e.results].flatMap(r=>[...r].map(x=>x.transcript)));
  };
  rec.onerror=e=>{if(e.error=="not-allowed"||e.error=="service-not-allowed"){live=false;ui();$("heard").textContent=t("allowMic")}};
  rec.onend=()=>{if(step==2&&!busy)return done();if(live&&!busy)setTimeout(()=>{if(live&&!busy)try{startRec()}catch(x){}},200)};
  try{rec.start()}catch(x){}
}
function pauseRec(){try{rec&&rec.abort()}catch(x){}rec=null}
function resumeRec(){if(live&&!rec)startRec();$("heard").textContent=t("listening")}
function stopRec(){live=false;pauseRec();ui()}
function ui(){$("mic").textContent=live?t("stop"):t("talk");$("mic").classList.toggle("on",live)}
$("mic").onclick=()=>{
  if(!SR){$("msg").textContent=t("b_nomic");return}
  if(live){stopRec();return}live=true;ui();$("heard").textContent=t("listening");startRec();
};
$("hear").onclick=()=>speak(art(a)+a.w+"... "+a.s);$("again").onclick=()=>{start()};start();
</script>
</body></html>
