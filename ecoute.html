<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jeux des animaux</title>
<link rel="icon" href="data:,">
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#eaf7ff;color:#333;text-align:center;min-height:100vh;overflow-x:hidden}
.menu{display:inline-block;margin:10px 4px;padding:10px 16px;background:#6c5ce7;color:#fff;border-radius:12px;text-decoration:none;font-size:1.1rem}
h1{font-size:1.6rem;margin:6px 0}
button{font-size:1.25rem;padding:14px 20px;border:0;border-radius:14px;margin:6px;background:#00b894;color:#fff;cursor:pointer}
button.say{background:#0984e3}button.tap{background:#fdcb6e;color:#333}button.on{background:#d63031}
.big{font-size:7rem;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:12px auto;padding:0 12px}
.opt{background:#fff;color:#333;font-size:1.5rem;padding:16px 6px;box-shadow:0 3px 8px #0002;margin:0}
.opt.e{font-size:4rem;padding:8px}
.ok{background:#55efc4!important}.no{background:#fab1a0!important}
#msg{min-height:1.6em;font-size:1.2rem;padding:0 12px}
#score{font-size:1.2rem;font-weight:bold}
#kid{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:1.3rem;font-weight:bold;margin:6px}
#end{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;font-size:1.6rem;background:#fff7e6;z-index:9}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.25)}}

</style></head><body>
<a class="menu" href="./" data-t="menu">🏠 Menu</a>
<div id="kid"></div>
<h1 data-t="gEcoute" data-i="0"></h1>

<button class="say" id="play" data-t="hearBtn"></button><div id="score"></div><div id="msg"></div><div class="grid" id="opts"></div><div id="end"><div style="font-size:5rem">🏆</div><div id="endtxt"></div><button id="again" data-t="again"></button><a class="menu" href="./" data-t="menu"></a></div>
<script>
header();document.title=document.querySelector("h1").textContent;
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pop(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function endScreen(txt){$("endtxt").textContent=txt;$("end").style.display="flex";speak(t("bravo"))}
</script>
<script>
let round,score,cur,lock=false;const N=10;
function start(){round=0;score=0;$("end").style.display="none";next()}
function next(){if(round>=N)return endScreen(t("e_end",score,N));round++;$("score").textContent=t("e_q",round,N,score);
  const opts=shuffle(ANIMALS).slice(0,4);cur=opts[Math.floor(Math.random()*4)];$("msg").textContent=TTS?t("e_go"):t("e_notts",cur.w);
  const g=$("opts");g.innerHTML="";opts.forEach(a=>{const b=document.createElement("button");b.className="opt e";b.textContent=a.e;b.onclick=()=>pick(b,a);g.appendChild(b)});setTimeout(()=>speak(cur.w),300)}
function pick(b,a){if(lock)return;
  if(a===cur){lock=true;b.classList.add("ok");score++;$("msg").textContent=t("e_yes",art(a)+a.w);speak(t("bravo")+" "+art(a)+a.w);setTimeout(()=>{lock=false;next()},1300)}
  else{b.classList.add("no");$("msg").textContent=t("e_no",art(a)+a.w);speak(art(a)+a.w)}}
$("play").onclick=()=>speak(cur.w);$("again").onclick=start;start();
</script>
</body></html>
