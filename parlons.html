 ["m","Yes, my teeth are clean!","Oui, mes dents sont propres !","¡Sí, tengo los dientes limpios!"],
 ["n","Which story do you want?","Quelle histoire tu veux ?","¿Qué cuento querés?"],
 ["c",["The story of the little rabbit!","L'histoire du petit lapin !","¡El cuento del conejito!","Okay, the little rabbit.","D'accord, le petit lapin.","Dale, el conejito."],
      ["The story of the dragon!","L'histoire du dragon !","¡El cuento del dragón!","Okay, the dragon. Grrr!","D'accord, le dragon. Grrr !","Dale, el dragón. ¡Grrr!"]],
 ["n","The end. Good night, my treasure.","Fin. Bonne nuit, mon trésor.","Fin. Buenas noches, mi amor."],
 ["m","Good night, Mum. I love you.","Bonne nuit, maman. Je t'aime.","Buenas noches, mamá. Te quiero."],
 ["n","I love you too. Sweet dreams!","Moi aussi je t'aime. Fais de beaux rêves !","Yo también te quiero. ¡Que sueñes lindo!"]]}];

const C=CONV,BASE=C.BASE,T=LANG,$=id=>document.getElementById(id),LI={en:1,fr:2,es:3},KID=C.KID;
const U={
 intro:{fr:"Joue une petite scène : écoute, réponds et dis tes phrases à voix haute !",es:"Jugá una escena: escuchá, respondé y decí tus frases en voz alta.",en:"Play a little scene: listen, answer and say your lines out loud!"},
 hard:{fr:"🙈 Mode défi : sans le texte",es:"🙈 Modo desafío: sin el texto",en:"Challenge: hide my lines"},
 you:{fr:"À toi ! Dis :",es:"¡Te toca! Decí:",en:"Your turn! Say:"},youC:{fr:"À toi ! Choisis ta réponse :",es:"¡Te toca! Elegí tu respuesta:",en:"Your turn! Pick your answer:"},
 said:{fr:"✅ Je l'ai dit",es:"✅ Ya lo dije",en:"I said it"},skip:{fr:"Passer ➡️",es:"Seguir ➡️",en:"Skip"},
 ok:{fr:["Bravo !","Super !","Très bien dit !","Parfait !"],es:["¡Muy bien!","¡Genial!","¡Bárbaro!","¡Perfecto!"],en:["Well done!","Great!","Nicely said!","Perfect!"]},
 again:{fr:"Presque ! Écoute 🔊 et réessaie.",es:"¡Casi! Escuchá 🔊 y probá otra vez.",en:"Almost! Listen and try again."},
 show:{fr:"Montre-moi",es:"Mostrame",en:"Show me"},my:{fr:"Ma langue",es:"Mi idioma",en:"My language"},quit:{fr:"← Autres histoires",es:"← Otras historias",en:"Other stories"},
 end:{fr:(s,n)=>`${s} / ${n} phrases bien dites !`,es:(s,n)=>`¡${s} / ${n} frases bien dichas!`,en:(s,n)=>`${s} of ${n} lines said out loud`},other:{fr:"Autre histoire",es:"Otra historia",en:"Another story"}};
const u=(k,...a)=>{const v=U[k][T];return typeof v=="function"?v(...a):v},ub=(k,...a)=>{const v=U[k][BASE];return typeof v=="function"?v(...a):v};
const bi=(k,...a)=>`${u(k,...a)}<small>${ub(k,...a)}</small>`;
header();document.title=t("gTalk")[0];

const KEY="talk_"+KID+"_"+T;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function store(id,n,max){const s=load();s[id]=Math.max(s[id]||0,n);s._max=s._max||{};s._max[id]=max;try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
let HARD=localStorage.getItem("talk_hard")=="1";
function show(id){["home","play","end"].forEach(x=>$(x).style.display=x==id?"block":"none");scrollTo(0,0)}
function pop(el,c){el.classList.remove(c||"pop");void el.offsetWidth;el.classList.add(c||"pop")}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]);

/* fill {k} / {npc} in one language */
let SC;
function fill(s,L){const nm=SC.npc[L]||SC.npc[T];return s.replace(/\{k\}/g,KID=="x"?"":KID).replace(/\{npc\}/g,nm)}
const tx=arr=>({en:fill(arr[0],"en"),fr:fill(arr[1],"fr"),es:fill(arr[2],"es")});
const npcName=L=>SC.npc[L]||SC.npc[T];

/* home */
function home(){show("home");const s=load();
  $("base").style.display=T=="es"?"inline-flex":"none";$("base").innerHTML=`<span>${U.my[BASE]} :</span>`+["en","fr"].map(L=>`<button data-l="${L}" class="${L==BASE?"sel":""}">${C.FLAG[L]} ${C.LNAME[L]}</button>`).join("");
  $("base").querySelectorAll("button").forEach(b=>b.onclick=()=>C.setBase(b.dataset.l));
  $("hard").innerHTML=bi("hard");$("hard").classList.toggle("on",HARD);$("intro").innerHTML=bi("intro");
  const g=$("scenes");g.innerHTML="";SCENES.forEach(sc=>{const b=document.createElement("button");b.className="scene";b.style.background=sc.col;b.dataset.id=sc.id;
    const got=s[sc.id]||0,mx=(s._max||{})[sc.id];
    b.innerHTML=`<span class="e">${sc.e}</span>${esc(sc.title[T])}<small>${esc(sc.title[BASE])}</small><span class="st">${mx?"⭐ "+got+" / "+mx:"▶️"}</span>`;
    b.onclick=()=>start(sc);g.appendChild(b)})}
$("hard").onclick=()=>{HARD=!HARD;try{localStorage.setItem("talk_hard",HARD?"1":"0")}catch(e){}home()};

/* playing a scene */
let i,stars,lines,cur,tries,lastNpc,busy;
function start(sc){SC=sc;i=0;stars=0;lines=0;lastNpc=null;show("play");$("chat").innerHTML="";$("npcAv").textContent=sc.npc.e;$("npcName").innerHTML=esc(npcName(T))+(sc.npc[BASE]&&sc.npc[BASE]!=sc.npc[T]?`<small>${esc(sc.npc[BASE])}</small>`:"");
  $("quit").innerHTML=bi("quit");step()}
function bubble(who,t3,star){const m=document.createElement("div");m.className="msg "+who;const av=document.createElement("div");av.className="av";
  if(who=="npc"){av.textContent=SC.npc.e}else{av.style.background=KCOL[KID]||"#a29bfe";const ph=localStorage.getItem("fr_photo_"+KID);if(ph)av.style.backgroundImage=`url(${ph})`;else av.textContent=(KID[0]||"🙂")}
  const b=document.createElement("div");b.className="b";b.textContent=t3[T];if(star)b.insertAdjacentHTML("beforeend",' <span class="st">⭐</span>');b.onclick=()=>speak(t3[T]);
  m.append(av,b);$("chat").appendChild(m);$("chat").scrollTop=$("chat").scrollHeight;return m}
function npcSay(t3,then){busy=true;$("panel").style.visibility="hidden";const ty=bubble("npc",{[T]:"• • •"});ty.classList.add("typing");
  setTimeout(()=>{ty.remove();bubble("npc",t3);lastNpc=t3;speak(t3[T]);setTimeout(()=>{busy=false;then()},Math.min(2600,600+t3[T].length*45))},700)}
function step(){$("help").style.display="none";
  if(i>=SC.lines.length)return finish();const L=SC.lines[i];
  if(L[0]=="n"){i++;return npcSay(tx(L.slice(1)),step)}
  showSm();$("panel").style.visibility="visible";$("fb").textContent="";$("heard").textContent="";tries=0;
  if(L[0]=="m"){cur={t:tx(L.slice(1))};ask()}
  else{cur=null;$("turnLbl").innerHTML=bi("youC");$("line").textContent="";$("line").className="";$("acts").style.display="none";const o=$("opts");o.innerHTML="";
    L.slice(1).forEach(op=>{const b=document.createElement("button");const t3=tx(op);b.innerHTML=esc(t3[T])+(BASE!=T?`<small>${esc(t3[BASE])}</small>`:"");
      b.onclick=()=>{speak(t3[T]);cur={t:t3,reply:op.length>3?tx(op.slice(3)):null};ask()};o.appendChild(b)})}}
function ask(){$("opts").innerHTML="";$("turnLbl").innerHTML=bi("you");const l=$("line");l.className=HARD?"hid":"";l.textContent=HARD?"• • • • •":cur.t[T];
  $("acts").style.display="flex";$("skip").style.display="none";$("said").style.display="inline-block";showSm()}
function done(said){lines++;if(said)stars++;$("panel").style.visibility="hidden";$("fb").textContent="";bubble("me",cur.t,said);i++;
  if(said){SFX.good();const r=$("chat").getBoundingClientRect();burst(r.right-60,r.bottom-30,16)}
  const rep=cur.reply;cur=null;busy=true;if(rep)npcSay(rep,step);else setTimeout(()=>{busy=false;step()},500)}

/* Show me: the last thing said to you + what you should say, in any language */
function showSm(){const el=$("sm");el.innerHTML=`<b>👀 ${ub("show")}</b>`+C.HELP.map(L=>`<button data-l="${L}">${C.FLAG[L]} ${C.LNAME[L]}</button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>hint(b.dataset.l))}
function hint(L){const h=$("help");h.style.display="block";let html="";
  if(lastNpc)html+=`<div>${SC.npc.e} ${esc(lastNpc[L])}</div>`;
  if(cur)html+=`<div><b>👉 ${esc(cur.t[L])}</b></div>`;else{const op=SC.lines[i];if(op&&op[0]=="c")html+=op.slice(1).map(o=>`<div>👉 ${esc(tx(o)[L])}</div>`).join("")}
  h.innerHTML=`<b>${C.FLAG[L]}</b>`+html;if(L==T&&cur){speak(cur.t[T]);if(HARD){$("line").className="";$("line").textContent=cur.t[T]}}}

/* speaking */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const NAMES=new Set(["mateo","felipe","tata","lea","lucia","hugo","tomas","max","rocky","pipo"]);
function score(heard,target){const tw=norm(target).split(" ").filter(w=>w&&!NAMES.has(w)),hw=norm(heard).split(" ");if(tw.length<=1)return hw.join("").length?1:0;
  return tw.filter(w=>hw.includes(w)).length/tw.length}
$("hearMe").onclick=()=>cur&&speak(cur.t[T]);
$("said").onclick=()=>{if(!cur||busy)return;done(!SR)};
$("skip").onclick=()=>{if(cur&&!busy)done(false)};
$("mic").onclick=()=>{if(!cur||busy)return;const h=$("heard");if(!SR){h.textContent=t("nosr");return}
  const r=new SR();r.lang=SRLANG;r.maxAlternatives=5;h.textContent=t("listening");$("mic").classList.add("on");
  r.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript);h.textContent=t("heard",alts[0]);
    if(Math.max(...alts.map(a=>score(a,cur.t[T])))>=.6){$("fb").textContent=C.pick(U.ok[T]);done(true)}
    else{tries++;$("fb").innerHTML=bi("again");pop($("line"),"shake");speak(cur.t[T]);if(tries>=2){$("skip").innerHTML=bi("skip");$("skip").style.display="inline-block"}}};
  r.onerror=e=>{h.textContent=e.error==="not-allowed"?t("allowMic"):t("nothing")};r.onend=()=>$("mic").classList.remove("on");try{r.start()}catch(e){}};
$("said").innerHTML=bi("said");

function finish(){store(SC.id,stars,lines);show("end");const n=stars>=lines?3:stars>=lines*.6?2:1;$("stars").textContent="⭐".repeat(n)+"☆".repeat(3-n);
  $("endtxt").innerHTML=bi("end",stars,lines);$("other").textContent=u("other");confetti();SFX.good();speak(t("bravo"))}
$("again").onclick=()=>start(SC);$("other").onclick=home;$("quit").onclick=home;
home();
window.TALK={SCENES,score};
</script>
</body></html>
