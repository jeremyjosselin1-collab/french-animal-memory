<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jeux des animaux</title>
<link rel="icon" href="data:,">
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#fff0f6;color:#333;text-align:center;min-height:100vh;overflow-x:hidden}
.menu{display:inline-block;margin:10px 4px;padding:10px 16px;background:#6c5ce7;color:#fff;border-radius:12px;text-decoration:none;font-size:1.1rem}
h1{font-size:1.6rem;margin:6px 0}
button{font-size:1.25rem;padding:14px 20px;border:0;border-radius:14px;margin:6px;background:#00b894;color:#fff;cursor:pointer}
button.say{background:#0984e3}button.tap{background:#fdcb6e;color:#333}button.on{background:#d63031}
.big{font-size:7rem;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:12px auto;padding:0 12px}
.opt{background:#fff;color:#333;font-size:1.5rem;padding:16px 6px;box-shadow:0 3px 8px #0002;margin:0}
.opt.e{font-size:4rem;padding:8px}
.ok{background:#55efc4!important}.no{background:#fab1a0!important}
#msg{min-height:1.6em;font-size:1.2rem;padding:0 12px}
#score{font-size:1.2rem;font-weight:bold}
#kid{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:1.3rem;font-weight:bold;margin:6px}
#end{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;font-size:1.6rem;background:#fff7e6;z-index:9}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.25)}}
#timer{font-size:2rem;font-weight:bold;color:#d63031}
</style></head><body>
<a class="menu" href="./" data-t="menu">🏠 Menu</a>
<div id="kid"></div>
<h1 data-t="gRapide" data-i="0"></h1>

<div id="timer">⏱ 45</div><div id="score"></div><div class="big" id="emo">⚡</div><div id="msg"></div>
<button id="go" data-t="k_go"></button><div class="grid" id="opts"></div><div id="end"><div style="font-size:5rem">🏆</div><div id="endtxt"></div><button id="again" data-t="again"></button><a class="menu" href="./" data-t="menu"></a></div>
<script>
header();document.title=document.querySelector("h1").textContent;
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pop(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function endScreen(txt){$("endtxt").textContent=txt;$("end").style.display="flex";speak(t("bravo"))}
</script>
<script>
let tm,score,timer,cur,run=false;
function start(){score=0;tm=45;run=true;$("end").style.display="none";$("go").style.display="none";$("msg").textContent=t("k_msg");tick();timer=setInterval(tick,1000);next()}
function tick(){$("timer").textContent="⏱ "+tm;if(tm--<=0){clearInterval(timer);run=false;$("opts").innerHTML="";$("go").style.display="inline-block";endScreen(t("k_end",score))}}
function next(){const opts=shuffle(ANIMALS).slice(0,4);cur=opts[Math.floor(Math.random()*4)];const e=$("emo");e.textContent=cur.e;pop(e);$("score").textContent="⭐ "+score;
  const g=$("opts");g.innerHTML="";opts.forEach(a=>{const b=document.createElement("button");b.className="opt";b.textContent=a.w;b.onclick=()=>pick(b,a);g.appendChild(b)})}
function pick(b,a){if(!run)return;if(a===cur){score++;speak(a.w);next()}else{b.classList.add("no");tm=Math.max(0,tm-2);$("msg").textContent=t("k_oops",art(cur)+cur.w)}}
$("go").onclick=start;$("again").onclick=()=>{$("end").style.display="none";start()};
</script>
</body></html>
