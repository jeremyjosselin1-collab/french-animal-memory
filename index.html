<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jeux des animaux</title>
<link rel="icon" href="data:,">
<script src="i18n.js"></script>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fff7e6;color:#333;text-align:center;min-height:100vh;padding:16px;box-sizing:border-box}
h1{font-size:2rem;margin:10px 0 20px}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}
.prof{background:#fff;border-radius:24px;padding:18px;width:min(42vw,220px);min-width:150px;box-shadow:0 5px 14px #0002}
.av{width:120px;height:120px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:3.5rem;font-weight:bold;color:#fff;background:#a29bfe center/cover no-repeat;cursor:pointer;border:4px solid #fff;box-shadow:0 2px 8px #0003}
.name{font-size:1.6rem;font-weight:bold;margin:10px 0}
button{font-size:1.1rem;padding:10px 14px;border:0;border-radius:12px;margin:4px;background:#00b894;color:#fff;cursor:pointer}
button.ph{background:#636e72;font-size:.95rem}
.lang{display:block;width:min(90vw,420px);margin:14px auto;padding:26px;font-size:1.8rem;font-weight:bold;border-radius:24px;background:#fff;color:#333;box-shadow:0 5px 14px #0002}
.lang span{font-size:3.5rem;display:block}
.game{display:block;margin:8px;padding:26px 16px;border-radius:24px;color:#fff;text-decoration:none;font-size:1.6rem;font-weight:bold;box-shadow:0 5px 14px #0003}
.game span{display:block;font-size:3.5rem}
small{display:block;font-size:1rem;font-weight:normal;margin-top:6px}
#head{display:flex;align-items:center;justify-content:center;gap:12px;font-size:1.5rem;font-weight:bold}
#head .av{width:64px;height:64px;font-size:1.8rem;margin:0}
#pick,#games,#langs{display:none}
#gg{display:grid;grid-template-columns:1fr;max-width:900px;margin:auto}@media(min-width:700px){#gg{grid-template-columns:1fr 1fr}}
a.sw{color:#6c5ce7;font-size:1.1rem;margin:0 8px}
#langBtn{font-size:.95rem;padding:8px 12px;background:#fff;color:#333;box-shadow:0 1px 4px #0003}
</style></head><body>
<div id="langs">
<h1>🌐 Langue / Idioma</h1>
<button class="lang" data-l="fr"><span>🇫🇷</span>Français</button>
<button class="lang" data-l="es"><span>🇦🇷</span>Español (Argentina)</button>
</div>
<div id="pick">
<h1 data-t="who"></h1>
<div class="row" id="profiles"></div>
<p><button id="langBtn"></button></p>
</div>
<div id="games">
<div id="head"></div>
<a class="sw" href="#" id="switch" data-t="switchKid"></a> <button id="langBtn2"></button>
<h1 data-t="games"></h1>
<div id="gg"></div>
</div>
<p style="margin-top:30px"><a href="proto/" style="color:#636e72;font-size:.95rem">🧪 Prototypes (test)</a></p>
<p style="margin-top:6px"><a href="claude-proto/" style="color:#636e72;font-size:.95rem">🧪 Prototypes Claude (test)</a></p>
<input type="file" id="file" accept="image/*" style="display:none">
<script>
const COL=KCOL;
const GAMES=[["memoire.html","🃏","gMemoire","#6c5ce7,#a29bfe"],["repete.html","🦆","gRepete","#00b894,#55efc4"],["ecoute.html","👂","gEcoute","#0984e3,#74b9ff"],["rapide.html","⚡","gRapide","#e84393,#fd79a8"],["lettres.html","🔤","gLettres","#00b894,#badc58"],["histoire.html","📖","gHistoire","#f39c12,#fdcb6e"],["combien.html","🔢","gCombien","#6c5ce7,#81ecec"],["bonjour.html","🗣️","gBonjour","#e17055,#fab1a0"],["oiseaux.html","🐦","gOiseaux","#d63031,#fdcb6e"],["maths.html","🧮","gMaths","#fdcb6e,#e84393"]];
const $=id=>document.getElementById(id),photo=n=>localStorage.getItem("fr_photo_"+n);
let target=null;
const LN=LANG=="es"?"Spanish":"French";
const EN={gMemoire:"Find the pairs and say the name in "+LN+"!",gRepete:"Repeat the word 10 times to make the animal fly away",gEcoute:"Listen and tap the right animal",gRapide:"Find the right name before time runs out",gLettres:"Fill in the missing letters",gHistoire:"Make up a silly sentence in "+LN,gCombien:"Count the animals in "+LN,gBonjour:"Say the animal's name, then make its sound",gOiseaux:"Angry-birds style: fling birds with the slingshot and knock down the animal named in "+LN,gMaths:"Magic maths: add, subtract, multiply and divide, and learn the numbers in "+LN};
header();document.title=t("games").replace("🐾 ","");
const other=LANG=="es"?"fr":"es";
[$("langBtn"),$("langBtn2")].forEach(b=>{b.textContent=S[LANG].lang+" ⇄ "+S[other].lang.split(" ")[0];b.onclick=()=>setLang(other)});
document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
GAMES.forEach(([h,e,k,c])=>{const a=document.createElement("a");a.className="game";a.href=h;a.style.background=`linear-gradient(135deg,${c})`;
  a.innerHTML=`<span>${e}</span>${t(k)[0]}<small>${EN[k]}</small>`;$("gg").appendChild(a)});
function show(id){["langs","pick","games"].forEach(x=>$(x).style.display=x==id?"block":"none")}
function avatar(n,el){const p=photo(n);el.style.backgroundColor=COL[n];el.style.backgroundImage=p?`url(${p})`:"";el.textContent=p?"":n[0]}
function renderPick(){
  show("pick");const box=$("profiles");box.innerHTML="";
  KIDS.forEach(n=>{const c=document.createElement("div");c.className="prof";c.dataset.kid=n;
    c.innerHTML=`<div class="av"></div><div class="name">${n}</div><button class="go">${t("play")}</button><br><button class="ph">${photo(n)?t("changePhoto"):t("addPhoto")}</button>`;
    avatar(n,c.querySelector(".av"));const up=()=>{target=n;$("file").click()};
    c.querySelector(".av").onclick=up;c.querySelector(".ph").onclick=up;c.querySelector(".go").onclick=()=>{localStorage.setItem("fr_current",n);showGames()};box.appendChild(c)});
}
function showGames(){const n=localStorage.getItem("fr_current");if(!KIDS.includes(n))return renderPick();show("games");
  const h=$("head");h.innerHTML=`<div class="av"></div><span>${n}</span>`;avatar(n,h.querySelector(".av"))}
$("switch").onclick=e=>{e.preventDefault();localStorage.removeItem("fr_current");renderPick()};
$("file").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f||!target)return;
  const url=URL.createObjectURL(f),img=new Image();
  img.onload=()=>{const Z=300,cv=document.createElement("canvas");cv.width=cv.height=Z;const m=Math.min(img.width,img.height);
    cv.getContext("2d").drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,Z,Z);URL.revokeObjectURL(url);
    try{localStorage.setItem("fr_photo_"+target,cv.toDataURL("image/jpeg",0.8))}catch(x){alert(t("bigPhoto"))}renderPick()};
  img.onerror=()=>alert(t("badPhoto"));img.src=url};
if(!localStorage.getItem("fr_lang"))show("langs");else if(localStorage.getItem("fr_current"))showGames();else renderPick();
</script>
</body></html>
