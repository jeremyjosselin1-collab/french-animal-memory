<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Jeux des animaux</title>
<link rel="icon" href="data:,">
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,sans-serif;background:#fff7e6;color:#333;text-align:center;min-height:100vh;overflow-x:hidden}
.menu{display:inline-block;margin:10px 4px;padding:10px 16px;background:#6c5ce7;color:#fff;border-radius:12px;text-decoration:none;font-size:1.1rem}
h1{font-size:1.6rem;margin:6px 0}
button{font-size:1.25rem;padding:14px 20px;border:0;border-radius:14px;margin:6px;background:#00b894;color:#fff;cursor:pointer}
button.say{background:#0984e3}button.tap{background:#fdcb6e;color:#333}button.on{background:#d63031}
.big{font-size:7rem;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:480px;margin:12px auto;padding:0 12px}
.opt{background:#fff;color:#333;font-size:1.5rem;padding:16px 6px;box-shadow:0 3px 8px #0002;margin:0}
.opt.e{font-size:4rem;padding:8px}
.ok{background:#55efc4!important}.no{background:#fab1a0!important}
#msg{min-height:1.6em;font-size:1.2rem;padding:0 12px}
#score{font-size:1.2rem;font-weight:bold}
#kid{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;font-size:1.3rem;font-weight:bold;margin:6px}
#end{display:none;position:fixed;inset:0;flex-direction:column;align-items:center;justify-content:center;font-size:1.6rem;background:#fff7e6;z-index:9}
.pop{animation:pop .4s}@keyframes pop{50%{transform:scale(1.25)}}
#status{min-height:2.6em;font-size:1.2rem;padding:0 10px}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:10px auto;padding:10px}
@media(min-width:700px){#grid{grid-template-columns:repeat(5,1fr);max-width:720px}}
.card{aspect-ratio:3/4;perspective:600px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.card.up .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 8px #0002}
.back{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;font-size:2.4rem}
.front{background:#fff;transform:rotateY(180deg);font-size:3.2rem;flex-direction:column}
.front small{font-size:.9rem;margin-top:4px}.card.done .front{background:#c8f7c5}
#picker{display:none;max-width:420px;margin:16px auto;padding:0 14px}
#picker h2{font-size:1.8rem;margin:8px 0 0}#picker .en{font-size:1rem;color:#666;margin:2px 0 14px}
#picker button{display:block;width:100%;margin:12px 0;padding:22px 10px;font-size:2.2rem;font-weight:bold;border-radius:22px;box-shadow:0 4px 10px #0003}
#picker button small{display:block;font-size:1rem;font-weight:normal;margin-top:4px}
#vs{display:none;justify-content:center;gap:10px;max-width:480px;margin:6px auto;padding:0 10px}
.pl{flex:1;display:flex;align-items:center;gap:8px;padding:8px;border-radius:18px;background:#fff;border:4px solid transparent;opacity:.55;box-shadow:0 2px 6px #0002;transition:all .25s;text-align:left}
.pl.act{opacity:1;transform:scale(1.04);box-shadow:0 0 0 3px #fff,0 4px 14px #0004}
.pl .av{width:52px;height:52px;border-radius:50%;flex:none;background:#a29bfe center/cover no-repeat;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:bold}
.pl .nm{font-weight:bold;font-size:1.1rem;line-height:1.1}.pl .pt{font-size:1.9rem;font-weight:bold;line-height:1}.pl .tn{font-size:.8rem;font-weight:bold;min-height:1em}
#turn{display:none;font-size:1.3rem;font-weight:bold;margin:4px 12px;padding:8px;border-radius:14px;color:#fff}
#mode button{background:#e17055}
#b8{background:#00b894}#b16{background:#6c5ce7}
#panel{display:none;margin:10px auto;max-width:460px;padding:14px;background:#fff;border-radius:16px;box-shadow:0 3px 10px #0002}#panel .big{font-size:4rem}
</style></head><body>
<a class="menu" href="./" data-t="menu">🏠 Menu</a>
<div id="kid"></div>
<h1 data-t="gMemoire" data-i="0"></h1>

<div id="score"></div><div id="status"></div>
<div id="panel"><div class="big" id="pEmoji"></div><div data-t="m_say"></div>
<button id="mic" data-t="talk"></button><button class="tap" id="hint" data-t="hint"></button>
<div id="heard" style="min-height:1.5em;margin-top:6px"></div></div>
<div id="vs"></div><div id="turn"></div>
<div id="picker"><div id="stepMode"><h2 data-t="m_mode"></h2><div class="en" data-t="m_modeEn"></div>
<button id="mSolo" style="background:#00b894">🧒 <span data-t="m_solo"></span><small data-t="m_soloS"></small></button>
<button id="mBat" style="background:#e17055">⚔️ <span data-t="m_bat"></span><small data-t="m_batS"></small></button></div>
<div id="stepTheme" style="display:none"><h2 data-t="m_theme"></h2><div class="en" data-t="m_themeEn"></div>
<button id="tA" style="background:#00b894">🐶 <span data-t="m_tA"></span><small data-t="m_tAs"></small></button>
<button id="tF" style="background:#e17055">🍎 <span data-t="m_tF"></span><small data-t="m_tFs"></small></button>
<button id="tM" style="background:#6c5ce7">🐱🍕 <span data-t="m_tM"></span><small data-t="m_tMs"></small></button></div>
<div id="stepSize" style="display:none"><h2 data-t="m_pick"></h2><div class="en" data-t="m_pickEn"></div><button id="b8">🃏 <span data-t="m_8"></span><small data-t="m_8s"></small></button><button id="b16">🃏🃏 <span data-t="m_16"></span><small data-t="m_16s"></small></button>
<button id="bBack" style="background:#b2bec3;font-size:1.2rem;padding:12px 10px">← <span data-t="m_back"></span><small data-t="m_backEn"></small></button></div></div>
<div id="grid"></div><div id="end"><div style="font-size:5rem">🏆</div><div id="endtxt" style="text-align:center;padding:0 14px"></div><button id="again" data-t="again"></button><button id="rematch" style="display:none;background:#e17055"></button><a class="menu" href="./" data-t="menu"></a></div>
<script>
header();document.title=document.querySelector("h1").textContent;
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pop(el){el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")}
function endScreen(txt){$("endtxt").textContent=txt;$("end").style.display="flex";speak(t("bravo"))}
</script>
<script>
Object.assign(S.fr,{m_mode:"Comment jouer ?",m_modeEn:"How do you want to play?",m_solo:"Solo",m_soloS:"Play alone",m_bat:"Mode bataille",m_batS:"Mateo vs Felipe, taking turns",
m_yourTurn:"À toi !",m_turnOf:n=>`C'est au tour de ${n} !`,m_again2:n=>`Une paire ! ${n} rejoue !`,m_miss:n=>`Pas pareil ! Au tour de ${n}`,
m_bscore:(a,b)=>`${a} contre ${b}`,m_wins:n=>`${n} gagne la bataille !`,m_draw:"Égalité ! Bravo à tous les deux !",m_pairsN:(n,c)=>`${n} : ${c} paire${c>1?"s":""}`,m_rev:"⚔️ Revanche",m_revEn:"Rematch, other player starts"});
Object.assign(S.es,{m_mode:"¿Cómo querés jugar?",m_modeEn:"How do you want to play?",m_solo:"Solo",m_soloS:"Play alone",m_bat:"Modo batalla",m_batS:"Mateo vs Felipe, taking turns",
m_yourTurn:"¡Te toca!",m_turnOf:n=>`¡Le toca a ${n}!`,m_again2:n=>`¡Un par! ¡${n} juega de nuevo!`,m_miss:n=>`¡No son iguales! Le toca a ${n}`,
m_bscore:(a,b)=>`${a} contra ${b}`,m_wins:n=>`¡${n} gana la batalla!`,m_draw:"¡Empate! ¡Bravo a los dos!",m_pairsN:(n,c)=>`${n}: ${c} par${c>1?"es":""}`,m_rev:"⚔️ Revancha",m_revEn:"Rematch, other player starts"});
header();document.title=document.querySelector('h1').textContent;
const KIDS2=["Mateo","Felipe"],KCOL={Mateo:"#0984e3",Felipe:"#e17055"};
let BATTLE=false,cur=0,starter=0,bs=[0,0];
function renderVs(){const v=$("vs");v.style.display=BATTLE?"flex":"none";$("turn").style.display=BATTLE?"block":"none";if(!BATTLE){v.innerHTML="";return}
  v.innerHTML="";KIDS2.forEach((n,i)=>{const d=document.createElement("div");d.className="pl"+(i==cur?" act":"");d.id="pl"+i;d.style.borderColor=i==cur?KCOL[n]:"transparent";
    d.innerHTML='<div class="av"></div><div><div class="nm"></div><div class="pt"></div><div class="tn"></div></div>';
    const ph=localStorage.getItem("fr_photo_"+n),a=d.querySelector(".av");a.style.background=KCOL[n];if(ph){a.style.backgroundImage="url("+ph+")";a.style.backgroundSize="cover";a.style.backgroundPosition="center"}else a.textContent=n[0];
    d.querySelector(".nm").textContent=n;d.querySelector(".pt").textContent=bs[i];d.querySelector(".tn").textContent=i==cur?"👉 "+t("m_yourTurn"):"";v.appendChild(d)});
  const tb=$("turn");tb.style.background=KCOL[KIDS2[cur]];tb.textContent=t("m_turnOf",KIDS2[cur])}
function battleEnd(){const [a,b]=bs;const w=a==b?-1:(a>b?0:1);
  $("endtxt").innerHTML="";const h=document.createElement("div");h.textContent=w<0?t("m_draw"):t("m_wins",KIDS2[w]);h.style.cssText="font-weight:bold;font-size:1.8rem;margin-bottom:10px";$("endtxt").appendChild(h);
  KIDS2.forEach((n,i)=>{const d=document.createElement("div");d.textContent=(w==i?"🏆 ":"")+t("m_pairsN",n,bs[i]);d.style.cssText="font-size:1.4rem;color:"+KCOL[n]+";font-weight:bold";d.className="endrow";$("endtxt").appendChild(d)});
  $("rematch").innerHTML='<span></span><small style="display:block;font-size:.8rem;font-weight:normal"></small>';$("rematch").firstChild.textContent=t("m_rev");$("rematch").lastChild.textContent=t("m_revEn");
  $("rematch").style.display="inline-block";$("end").style.display="flex";speak(w<0?t("m_draw"):t("m_wins",KIDS2[w]))}
let PAIRS=4,THEME="A";
function themePool(n){if(THEME=="A")return shuffle(ANIMALS).slice(0,n);if(THEME=="F")return shuffle(FOODS).slice(0,n);const h=n/2;return shuffle([...shuffle(ANIMALS).slice(0,h),...shuffle(FOODS).slice(0,h)])}
const grid=$("grid"),status=$("status"),panel=$("panel");
let first=null,lock=false,pending=null,cleared=0,tries=0;
function choose(){grid.innerHTML="";grid.style.display="none";$("end").style.display="none";panel.style.display="none";$("score").textContent="";status.textContent="";$("picker").style.display="block";$("stepMode").style.display="block";$("stepTheme").style.display="none";$("stepSize").style.display="none";BATTLE=false;$("rematch").style.display="none";renderVs()}
function begin(n){PAIRS=n/2;$("picker").style.display="none";grid.style.display="grid";start()}
function start(){
  grid.innerHTML="";first=null;lock=false;pending=null;cleared=0;tries=0;panel.style.display="none";$("end").style.display="none";bs=[0,0];cur=BATTLE?starter:0;renderVs();
  const pick=themePool(PAIRS);
  shuffle([...pick,...pick]).forEach(a=>{const c=document.createElement("div");c.className="card";c.animal=a;
    c.innerHTML=`<div class="inner"><div class="face back">?</div><div class="face front">${a.e}<small></small></div></div>`;c.onclick=()=>tap(c);grid.appendChild(c)});
  status.textContent=BATTLE?"":t("m_turn");score();
}
function score(){if(BATTLE){$("score").textContent=t("m_score",cleared,PAIRS,tries);return}$("score").textContent=t("m_score",cleared,PAIRS,tries)}
function tap(c){
  if(lock||pending||c.classList.contains("up"))return;c.classList.add("up");
  if(!first){first=c;return}tries++;score();
  if(first.animal===c.animal){pending=[first,c];first=null;status.textContent=t("m_pair");$("pEmoji").textContent=c.animal.e;$("heard").textContent=SR?"":t("m_nomic");panel.style.display="block"}
  else{lock=true;const a=first;first=null;status.textContent=t("m_diff");setTimeout(()=>{a.classList.remove("up");c.classList.remove("up");lock=false;if(BATTLE){cur=1-cur;renderVs();status.textContent=t("m_miss",KIDS2[cur])}},900)}
}
function success(){
  const a=pending[0].animal;pending.forEach(c=>{c.classList.add("done");c.querySelector("small").textContent=a.food?art(a)+a.w:a.w});
  speak(t("bravo")+" "+a.w);status.textContent=t("m_ok",a.w);pending=null;panel.style.display="none";cleared++;if(BATTLE){bs[cur]++;renderVs();status.textContent=t("m_again2",KIDS2[cur])}score();
  if(cleared===PAIRS)setTimeout(()=>BATTLE?battleEnd():endScreen(t("won")),900);
}
$("mic").onclick=()=>{
  if(!pending)return;const heard=$("heard");if(!SR){heard.textContent=t("nosr");return}
  const r=new SR();r.lang=SRLANG;r.interimResults=false;r.maxAlternatives=5;heard.textContent=t("listening");
  r.onresult=e=>{const alts=[...e.results[0]].map(x=>" "+norm(x.transcript)+" ");const ws=names(pending[0].animal);
    const ok=ws.some(w=>alts.some(x=>x.includes(" "+w+" ")));heard.textContent=t("heard",e.results[0][0].transcript);
    if(ok)success();else{status.textContent=t("m_wrong");speak(t("tryAgain"))}};
  r.onerror=e=>{heard.textContent=e.error==="not-allowed"?t("allowMic"):t("nothing")};r.start();
};
$("hint").onclick=()=>{if(pending){const w=pending[0].animal.w;$("heard").textContent=t("hintIs")+w;speak(w)}};
$("tA").onclick=()=>theme("A");$("tF").onclick=()=>theme("F");$("tM").onclick=()=>theme("M");$("bBack").onclick=choose;
function theme(x){THEME=x;$("stepTheme").style.display="none";$("stepSize").style.display="block"}
$("b8").onclick=()=>begin(8);$("b16").onclick=()=>begin(16);
$("mSolo").onclick=()=>modePick(false);$("mBat").onclick=()=>modePick(true);
function modePick(b){BATTLE=b;starter=0;$("stepMode").style.display="none";$("stepTheme").style.display="block"}
$("rematch").onclick=()=>{starter=1-starter;start()};
$("again").onclick=choose;choose();
</script>
</body></html>
